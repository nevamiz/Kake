<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KAKE</title>
<style>
:root{
  --ice:#7fd8ff; --ice2:#c9f3ff; --volt:#1f6bff; --text:#d8ecff;
  box-sizing:border-box; color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#000; } }
:root[data-theme="dark"]{ --bg:#000; }
*,*::before,*::after{ box-sizing:inherit; }
html,body{ height:100%; margin:0; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
body{ background:#000; color:var(--text); font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; overflow:hidden; -webkit-tap-highlight-color:transparent; }

/* everything except the logo waits for .ready */
.later{ opacity:0; transition:opacity 1.1s ease; }
body.ready .later{ opacity:1; }

#stars{ position:fixed; inset:0; width:100%; height:100%; }
.aura{ position:fixed; inset:0; pointer-events:none;
  background:radial-gradient(55% 40% at 50% 46%, rgba(31,107,255,.38), transparent 70%),
             radial-gradient(40% 40% at 10% 100%, rgba(6,32,90,.9), transparent 70%),
             radial-gradient(40% 40% at 95% 0%, rgba(6,32,90,.7), transparent 70%); }
.floorWrap{ position:fixed; left:0; right:0; bottom:0; height:42%; overflow:hidden; pointer-events:none; perspective:380px;
  -webkit-mask-image:linear-gradient(to top,#000 5%,transparent 90%); mask-image:linear-gradient(to top,#000 5%,transparent 90%); }
.floor{ position:absolute; left:-60%; right:-60%; top:-100%; height:300%;
  background-image:linear-gradient(rgba(127,216,255,.32) 1px,transparent 1px),linear-gradient(90deg,rgba(127,216,255,.32) 1px,transparent 1px);
  background-size:64px 64px; transform-origin:50% 100%; transform:rotateX(64deg); animation:run 1.6s linear infinite; will-change:transform; }
@keyframes run{ to{ transform:rotateX(64deg) translateY(64px); } }

#intro{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:5; }

.stage{ position:relative; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px; padding:20px 14px 80px; text-align:center; }

.logo{ all:unset; position:relative; width:min(92vw,860px); display:block; cursor:pointer; transition:transform .2s ease-out; }
.logo:focus-visible{ outline:2px solid var(--ice); outline-offset:10px; border-radius:12px; }
.logo svg{ width:100%; height:auto; display:block; overflow:visible; }

.glow{ position:absolute; left:50%; top:50%; width:120%; height:190%; transform:translate(-50%,-50%); pointer-events:none;
  background:radial-gradient(closest-side, rgba(127,216,255,.45), rgba(31,107,255,.22) 45%, transparent 75%); opacity:0; }
body.shown .glow{ transition:opacity .8s; opacity:1; }
body.ready .glow{ animation:breathe 3s ease-in-out infinite; }
@keyframes breathe{ 50%{ opacity:.55; } }

/* hologram print reveal */
.logo svg{ visibility:hidden; }
@keyframes print{ from{ clip-path:inset(0 0 100% 0);} to{ clip-path:inset(0 0 0 0);} }
.scan{ position:absolute; left:-4%; right:-4%; top:0; height:3px; opacity:0; pointer-events:none;
  background:linear-gradient(90deg,transparent,#fff 30%,#fff 70%,transparent); box-shadow:0 0 18px 4px var(--ice); }
body.shown .scan{ animation:scanDown .7s cubic-bezier(.5,0,.2,1) forwards; }
@keyframes scanDown{ 0%{top:0;opacity:1} 90%{opacity:1} 100%{top:100%;opacity:0} }

.trace{ fill:none; stroke:#e6fbff; stroke-width:1.4; stroke-dasharray:1; stroke-dashoffset:1; }
body.shown .trace{ animation:draw .9s .1s ease-out forwards; }
@keyframes draw{ to{ stroke-dashoffset:0; } }

/* glitch burst */

@keyframes glitch{
  0%{ transform:translate(0); filter:none; }
  15%{ transform:translate(-8px,2px) skewX(8deg); filter:hue-rotate(40deg) brightness(1.6); }
  30%{ transform:translate(6px,-3px); clip-path:inset(20% 0 45% 0); }
  45%{ transform:translate(-3px,0) skewX(-6deg); clip-path:inset(60% 0 5% 0); }
  60%{ transform:translate(4px,1px); clip-path:none; filter:brightness(2); }
  75%{ transform:translate(0); filter:none; }
}

.sweep{ transform:translateX(-160px); }
body.ready .sweep{ animation:sweep 3.6s .4s ease-in-out infinite; }
@keyframes sweep{ 0%{ transform:translateX(-160px);} 55%,100%{ transform:translateX(620px);} }

.play{ font:600 15px/1 system-ui,-apple-system,'Segoe UI',sans-serif; letter-spacing:.04em;
  display:inline-flex; align-items:center; gap:10px; color:#001233; background:linear-gradient(90deg,var(--ice),var(--ice2));
  border:0; border-radius:999px; padding:15px 28px; cursor:pointer; box-shadow:0 0 24px rgba(127,216,255,.55);
  transform:translateY(14px); transition:opacity .7s .2s, transform .7s .2s cubic-bezier(.2,1.4,.4,1); }
body.ready .play{ transform:none; }
.play svg{ width:13px; height:13px; fill:currentColor; }
.play:focus-visible{ outline:2px solid #fff; outline-offset:4px; }

.info{ position:fixed; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 16px); display:flex; flex-wrap:wrap; justify-content:center; gap:8px 26px; font-size:14px; transition-delay:.4s; }
.info a{ color:var(--ice); text-decoration:none; border-bottom:1px solid rgba(127,216,255,.35); padding-bottom:2px; }
.info a:focus-visible{ outline:2px solid var(--ice); outline-offset:3px; }

#game{ position:fixed; inset:0; z-index:50; display:none; background:#000814;
  padding:calc(env(safe-area-inset-top,0px) + 56px) 8px calc(env(safe-area-inset-bottom,0px) + 8px); }
#game.open{ display:block; }
#game iframe{ width:100%; height:100%; border:1px solid rgba(127,216,255,.4); border-radius:16px; background:#0d1117; }
#close{ position:absolute; top:calc(env(safe-area-inset-top,0px) + 10px); right:10px; font:600 14px system-ui,sans-serif;
  color:var(--ice2); background:#06205a; border:1px solid rgba(127,216,255,.5); border-radius:999px; padding:10px 18px; cursor:pointer; }
#game .tag{ position:absolute; top:calc(env(safe-area-inset-top,0px) + 16px); left:16px; font:900 18px system-ui,sans-serif; letter-spacing:.14em; color:var(--ice); }
</style>
</head>
<body>
<canvas id="stars" class="later" aria-hidden="true"></canvas>
<div class="aura later" aria-hidden="true"></div>
<div class="floorWrap later" aria-hidden="true"><div class="floor"></div></div>

<main class="stage">
  <button class="logo" id="logo" style="transition:none" aria-label="KAKE – spela KAKE behöver lagring">
    <div class="glow"></div>
    <svg id="svg" viewBox="0 0 440 120" aria-hidden="true">
      <defs>
        <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#e6fbff"/><stop offset=".45" stop-color="#7fd8ff"/><stop offset="1" stop-color="#2f8dff"/>
        </linearGradient>
        <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </linearGradient>
        <clipPath id="clip">
          <path d="M0 0H22V50L68 0H98L44 60L98 120H68L22 70V120H0Z"/>
          <path clip-rule="evenodd" d="M115 120L150 0H175L210 120H186L178 92H147L139 120ZM153 72H172L162.5 36Z"/>
          <path d="M230 0H252V50L298 0H328L274 60L328 120H298L252 70V120H230Z"/>
          <path d="M348 0H440V22H370V49H428V71H370V98H440V120H348Z"/>
        </clipPath>
      </defs>
      <g class="solid" fill="url(#fill)">
        <path d="M0 0H22V50L68 0H98L44 60L98 120H68L22 70V120H0Z"/>
        <path fill-rule="evenodd" d="M115 120L150 0H175L210 120H186L178 92H147L139 120ZM153 72H172L162.5 36Z"/>
        <path d="M230 0H252V50L298 0H328L274 60L328 120H298L252 70V120H230Z"/>
        <path d="M348 0H440V22H370V49H428V71H370V98H440V120H348Z"/>
      </g>
      <g>
        <path class="trace" pathLength="1" d="M0 0H22V50L68 0H98L44 60L98 120H68L22 70V120H0Z"/>
        <path class="trace" pathLength="1" d="M115 120L150 0H175L210 120H186L178 92H147L139 120Z"/>
        <path class="trace" pathLength="1" d="M230 0H252V50L298 0H328L274 60L328 120H298L252 70V120H230Z"/>
        <path class="trace" pathLength="1" d="M348 0H440V22H370V49H428V71H370V98H440V120H348Z"/>
      </g>
      <g clip-path="url(#clip)"><rect class="sweep" x="0" y="-20" width="90" height="160" fill="url(#shine)" transform="skewX(-20)"/></g>
    </svg>
      </button>
  <button class="play later" id="play"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 0l9 5-9 5z"/></svg>Spela KAKE behöver lagring</button>
</main>

<nav class="info later">
  <a href="https://www.instagram.com/kenlundgrens/" target="_blank" rel="noopener">Instagram @kenlundgrens</a>
  <a href="https://www.youtube.com/@PoppaHessGaming" target="_blank" rel="noopener">Poppa Hess Gaming på YouTube</a>
</nav>

<canvas id="intro" aria-hidden="true"></canvas>

<div id="game" role="dialog" aria-modal="true" aria-label="KAKE behöver lagring">
  <div class="tag">KAKE</div>
  <button id="close">Stäng spelet</button>
</div>

<script>
(function(){
  const body=document.body, logo=document.getElementById('logo'), svg=document.getElementById('svg');
  const PATHS=[
    'M0 0H22V50L68 0H98L44 60L98 120H68L22 70V120H0Z',
    'M115 120L150 0H175L210 120H186L178 92H147L139 120ZM153 72H172L162.5 36Z',
    'M230 0H252V50L298 0H328L274 60L328 120H298L252 70V120H230Z',
    'M348 0H440V22H370V49H428V71H370V98H440V120H348Z'
  ];
  const ease=t=>1-Math.pow(1-t,3);
  const clamp=v=>v<0?0:v>1?1:v;

  /* ---------- INTRO: laser + particle vortex that assembles KAKE ---------- */
  const ic=document.getElementById('intro'), ix=ic.getContext('2d');
  let IW,IH,dpr,parts=[],cx,cy,rect;

  function buildTargets(){
    dpr=Math.min(devicePixelRatio||1,2);
    IW=innerWidth; IH=innerHeight; ic.width=IW*dpr; ic.height=IH*dpr;
    rect=svg.getBoundingClientRect();
    const s=rect.width/440, w=Math.ceil(rect.width), h=Math.ceil(120*s);
    const off=document.createElement('canvas'); off.width=w; off.height=h;
    const o=off.getContext('2d'); o.scale(s,s); o.fillStyle='#fff';
    PATHS.forEach(p=>o.fill(new Path2D(p),'evenodd'));
    const data=o.getImageData(0,0,w,h).data;
    const area=w*h*0.45, step=Math.max(3,Math.round(Math.sqrt(area/2400)));
    cx=rect.left+rect.width/2; cy=rect.top+rect.height/2;
    const R=Math.hypot(IW,IH)*0.6;
    parts=[];
    for(let y=0;y<h;y+=step) for(let x=0;x<w;x+=step){
      if(data[(y*w+x)*4+3]<128) continue;
      const tx=rect.left+x, ty=rect.top+y;
      const dx=tx-cx, dy=ty-cy, ang=Math.atan2(dy,dx), rad=Math.hypot(dx,dy);
      parts.push({
        tx,ty, ang, rad,
        a0: ang + 2.2 + Math.random()*1.6,          // swirl in
        r0: rad + R*(0.5+Math.random()*0.7),
        d: 0.35 + (x/w)*0.55 + Math.random()*0.25,  // builds left → right
        dur: 0.8 + Math.random()*0.35,
        sz: step*0.72*(0.7+Math.random()*0.6),
        hot: Math.random()<0.18
      });
    }
  }

  let start=null, done=false, glitchUntil=0, bands=[];
  function introFrame(now){
    if(start===null) start=now;
    const t=(now-start)/1000;
    ix.setTransform(dpr,0,0,dpr,0,0);
    ix.clearRect(0,0,IW,IH);
    ix.globalCompositeOperation='lighter';

    // 1) laser line opening across the screen
    if(t<1.6){
      const open=ease(clamp(t/0.45)), fade=1-clamp((t-0.9)/0.7);
      const half=IW*0.55*open;
      const g=ix.createLinearGradient(cx-half,0,cx+half,0);
      g.addColorStop(0,'rgba(127,216,255,0)'); g.addColorStop(.5,`rgba(230,251,255,${fade})`); g.addColorStop(1,'rgba(127,216,255,0)');
      ix.fillStyle=g; ix.fillRect(cx-half,cy-1.5,half*2,3);
      ix.fillStyle=`rgba(31,107,255,${0.35*fade})`; ix.fillRect(cx-half,cy-10,half*2,20);
      const cr=14*open*fade+2;
      const rg=ix.createRadialGradient(cx,cy,0,cx,cy,cr*4);
      rg.addColorStop(0,`rgba(255,255,255,${fade})`); rg.addColorStop(1,'rgba(127,216,255,0)');
      ix.fillStyle=rg; ix.beginPath(); ix.arc(cx,cy,cr*4,0,Math.PI*2); ix.fill();
    }

    // glitch slices (after the intro)
    const glitching = now<glitchUntil;
    if(glitching && Math.random()<0.5){
      bands=[]; for(let i=0;i<3;i++){ const y=rect.top+Math.random()*rect.height; bands.push([y, y+rect.height*(0.08+Math.random()*0.15), (Math.random()-.5)*28]); }
    }
    // shine band sweeping across every 3.6 s once settled
    const st = t>3 ? ((t-3)%3.6)/3.6 : -1;
    const sweepX = st>=0 && st<0.55 ? rect.left-80 + (rect.width+160)*(st/0.55) : -9999;

    // 2) particle vortex converging into the letters – and staying as the logo
    for(const p of parts){
      const k=clamp((t-p.d)/p.dur);
      if(k<=0) continue;
      const e=ease(k);
      let x,y;
      if(k<1){ const a=p.a0+(p.ang-p.a0)*e, r=p.r0+(p.rad-p.r0)*e; x=cx+Math.cos(a)*r; y=cy+Math.sin(a)*r; }
      else { x=p.tx+(Math.random()-.5)*0.9; y=p.ty+(Math.random()-.5)*0.9; }
      if(glitching) for(const bd of bands) if(y>bd[0]&&y<bd[1]) x+=bd[2];
      let alpha=Math.min(1,k*3);
      let hot=p.hot;
      if(k>=1){
        p.tw+=(Math.random()-.5)*0.2; p.tw=clamp(p.tw);
        alpha*=0.8+0.2*p.tw;
        const dxs=Math.abs(x-sweepX-(y-rect.top)*0.35);
        if(dxs<40){ hot=true; alpha=Math.min(1,alpha+ (1-dxs/40)); }
      }
      ix.fillStyle = hot ? `rgba(255,255,255,${alpha})` : (glitching&&p.hot ? `rgba(80,120,255,${alpha})` : `rgba(127,216,255,${alpha})`);
      const sz=p.sz*(k<1?1.6-0.6*e:1);
      ix.fillRect(x-sz/2,y-sz/2,sz,sz);
      if(k<1){
        const k2=clamp(k-0.06), pa=p.a0+(p.ang-p.a0)*ease(k2), pr=p.r0+(p.rad-p.r0)*ease(k2);
        ix.strokeStyle=`rgba(31,140,255,${alpha*0.6})`; ix.lineWidth=sz*0.6;
        ix.beginPath(); ix.moveTo(cx+Math.cos(pa)*pr,cy+Math.sin(pa)*pr); ix.lineTo(x,y); ix.stroke();
      }
    }

    if(t>=1.95 && !body.classList.contains('shown')) body.classList.add('shown');
    if(t>=2.4 && !logo.dataset.g){ logo.dataset.g=1; glitch(); }
    if(t>=2.8 && !done){ done=true; body.classList.add('ready'); }
    requestAnimationFrame(introFrame);
  }

  function glitch(){ glitchUntil=performance.now()+380; }
  setInterval(()=>{ if(body.classList.contains('ready') && !document.hidden) glitch(); }, 7000);

  function go(){ buildTargets(); parts.forEach(p=>p.tw=Math.random()); requestAnimationFrame(introFrame); }
  if(document.visibilityState==='visible') requestAnimationFrame(go);
  else document.addEventListener('visibilitychange',function v(){ if(document.visibilityState==='visible'){ document.removeEventListener('visibilitychange',v); requestAnimationFrame(go);} });
  let rz; addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(start===null) return; buildTargets(); parts.forEach(p=>{p.tw=Math.random(); p.d=0; p.dur=0.001;}); },150); });

  /* ---------- starfield (after intro) ---------- */
  const c=document.getElementById('stars'), x=c.getContext('2d');
  let W,H,stars=[];
  function size(){
    W=c.width=innerWidth; H=c.height=innerHeight;
    const n=Math.min(260,Math.round(W*H/6000));
    stars=Array.from({length:n},()=>({x:(Math.random()-.5)*W,y:(Math.random()-.5)*H,z:Math.random()*W}));
  }
  let readyAt=null;
  function frame(now){
    x.clearRect(0,0,W,H);
    let speed=0.003;
    if(body.classList.contains('ready')){ if(readyAt===null) readyAt=now; const a=(now-readyAt)/1000; speed = a<1.2 ? 0.03*(1.2-a)+0.003 : 0.003; }
    for(const s of stars){
      s.z-=W*speed;
      if(s.z<1){ s.z=W; s.x=(Math.random()-.5)*W; s.y=(Math.random()-.5)*H; }
      const k=W*.5/s.z, px=s.x*k+W/2, py=s.y*k+H/2;
      if(px<0||px>W||py<0||py>H) continue;
      const r=Math.max(.5,(1-s.z/W)*2.2);
      x.fillStyle=s.z<W*.3?'#c9f3ff':'#3f7dff';
      x.fillRect(px,py,r,r);
    }
    requestAnimationFrame(frame);
  }
  addEventListener('resize',size); size(); requestAnimationFrame(frame);

  /* ---------- game ---------- */
  const game=document.getElementById('game'); let fr=null, last=null, html=null;
  function src(){
    if(html) return html;
    const b=atob(document.getElementById('gamesrc').textContent.trim());
    const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i);
    return html=new TextDecoder('utf-8').decode(u);
  }
  function open(){
    last=document.activeElement;
    fr=document.createElement('iframe'); fr.title='KAKE behöver lagring'; fr.srcdoc=src();
    game.appendChild(fr); game.classList.add('open');
    fr.addEventListener('load',()=>{ try{ fr.contentWindow.focus(); }catch(e){} });
  }
  function close(){ game.classList.remove('open'); if(fr){ fr.remove(); fr=null; } if(last) last.focus(); }
  logo.addEventListener('click',open);
  document.getElementById('play').addEventListener('click',open);
  document.getElementById('close').addEventListener('click',close);
  addEventListener('keydown',e=>{ if(e.key==='Escape'&&fr) close(); });
